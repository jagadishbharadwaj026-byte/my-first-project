```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #111827, #2563eb);
        color: white;
    }

    .card {
        width: 90%;
        max-width: 600px;
        padding: 50px 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    p {
        font-size: 18px;
        line-height: 1.6;
        color: #dbeafe;
        margin-bottom: 25px;
    }

    .button {
        display: inline-block;
        padding: 12px 25px;
        background: white;
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
        border-radius: 30px;
        transition: 0.3s;
    }

    .button:hover {
        transform: scale(1.05);
        background: #dbeafe;
    }

    .footer {
        margin-top: 30px;
        font-size: 14px;
        color: #bfdbfe;
    }
</style>
```

</head>

<body>

```
<div class="card">
    <h1>Hello, GitHub! 🚀</h1>

    <p>
        This is my first project hosted on GitHub.
        I'm learning web development, Git, and GitHub
        one step at a time.
    </p>

    <a href="https://github.com/" class="button">
        Visit GitHub
    </a>

    <div class="footer">
        Created by Jagadish • My First Repository
    </div>
</div>
```

</body>
</html>
